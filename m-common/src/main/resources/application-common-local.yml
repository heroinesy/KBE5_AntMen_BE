spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${SPRING_DATABASE_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # ===== 커넥션 최적화 (로컬에서 RDS 사용) =====

      # 로컬 개발용 최소 커넥션 설정
      maximum-pool-size: 2      # 기존 20개 → 2개로 대폭 감소
      minimum-idle: 1           # 최소 1개만 유지

      # 커넥션을 더 빨리 해제
      idle-timeout: 300000      # 5분 후 해제 (기존 30초 → 5분)
      max-lifetime: 600000      # 10분 후 교체 (기존 10분 유지)
      connection-timeout: 20000 # 20초 (기존 30초 → 20초)
      leak-detection-threshold: 30000  # 30초 (누수 빨리 탐지)

      # RDS 연결 최적화
      connection-test-query: SELECT 1
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
#    show-sql: true
    properties:
      hibernate:
        format_sql: false
#        format_sql: true
        # 없었던 거
#        generate_statistics: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          enabled: true
          max-active: 8      # 연결 수 제한을 8로 설정 (보수적으로)
          max-idle: 8
          min-idle: 1
          max-wait: 2000ms   # 커넥션 못 얻으면 최대 대기 시간 (2초)
  jackson:
    serialization:
        # 이 설정을 추가하면 날짜를 보낼 때 시간대 정보가 포함됩니다.
        # 예: "2025-07-15T16:30:00+09:00"
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul # Jackson의 기본 시간대도 서울로 설정


jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}

aws:
  s3:
    bucket-name: ${S3_BUCKET_NAME}
    region: ${S3_REGION}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    endpoint: http://localhost:19000
    static-url: http://localhost:19000/antmen-bucket/

springdoc:
  swagger-ui:
    path: /api/v1/docs

test:
  value: 123