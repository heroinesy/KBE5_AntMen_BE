name: Reusable Deploy JAR to EC2

permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      service_name:
        required: true
        type: string
      service_port:
        required: true
        type: string
      health_check_path:
        required: false
        type: string
        default: "/"
    secrets:
      MYSQL_DATABASE:
        required: true
      MYSQL_HOST:
        required: true
      MYSQL_PASSWORD:
        required: true
      MYSQL_PORT:
        required: true
      MYSQL_USERNAME:
        required: true
      SPRING_DATABASE_URL:
        required: true
      AWS_REGION:
        required: true
      AWS_ROLE_TO_ASSUME:
        required: true
      EC2_INSTANCE_ID:
        required: true
      S3_BUCKET_NAME:
        required: true
      S3_REGION:
        required: true
      S3_ACCESS_KEY:
        required: true
      S3_SECRET_KEY:
        required: true
      JWT_SECRET:
        required: true
      GOOGLE_CLIENT_ID:
        required: true
      GOOGLE_CLIENT_SECRET:
        required: true
      GOOGLE_REDIRECT_URI:
        required: true
      REDIS_HOST:
        required: true
      REDIS_PORT:
        required: true
      REDIS_PASSWORD:
        required: true
  workflow_dispatch:

jobs:
  build:
    name: 🛠 Build & Upload JAR
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.generate-artifact.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate artifact name
        id: generate-artifact
        run: |
          ARTIFACT_NAME=$(date +%y%m%dT%H%M)
          echo "artifact-name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "Generated artifact name: $ARTIFACT_NAME"

      - name: Gradle Build
        run: ./gradlew :${{ inputs.module }}:bootJar -x test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create S3 bucket if missing
        run: |
          aws s3api head-bucket --bucket ${{ secrets.S3_BUCKET_NAME }} 2>/dev/null || \
          aws s3api create-bucket --bucket ${{ secrets.S3_BUCKET_NAME }} --region ${{ secrets.AWS_REGION }} \
            --create-bucket-configuration LocationConstraint=${{ secrets.AWS_REGION }}

      - name: Upload JAR to S3
        run: |
          JAR_FILE=$(find ${{ inputs.module }}/build/libs -name "*.jar" | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "No JAR file found!"
            exit 1
          fi
          
          echo "Uploading JAR: $JAR_FILE"
          aws s3 cp "$JAR_FILE" s3://${{ secrets.S3_BUCKET_NAME }}/deploy/${{ inputs.module }}/${{ steps.generate-artifact.outputs.artifact-name }}.jar
          
          echo "JAR uploaded successfully to S3"

  deploy:
    name: 🚀 Deploy JAR to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          # 환경 변수 파일 준비
          cat > /tmp/env_content << 'EOF'
          SPRING_PROFILES_ACTIVE=prod
          SERVER_PORT=${{ inputs.service_port }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_HOST=${{ secrets.MYSQL_HOST }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_PORT=${{ secrets.MYSQL_PORT }}
          MYSQL_USERNAME=${{ secrets.MYSQL_USERNAME }}
          SPRING_DATABASE_URL=${{ secrets.SPRING_DATABASE_URL }}
          S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
          S3_REGION=${{ secrets.S3_REGION }}
          S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}
          EOF
  
          ENV_CONTENT=$(base64 -w 0 /tmp/env_content)
  
          # systemd 서비스 파일 준비
          cat > /tmp/service_content << EOF
          [Unit]
          Description=${{ inputs.service_name }} Spring Boot Application
          After=network.target
  
          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/home/ec2-user/apps/jar/${{ inputs.module }}
          EnvironmentFile=/home/ec2-user/apps/jar/${{ inputs.module }}/.env
          ExecStart=/usr/bin/java -jar /home/ec2-user/apps/jar/${{ inputs.module }}/${{ needs.build.outputs.artifact-name }}.jar
          ExecStop=/bin/kill -15 \$MAINPID
          Restart=always
          RestartSec=10
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=${{ inputs.service_name }}
  
          [Install]
          WantedBy=multi-user.target
          EOF
  
          SERVICE_CONTENT=$(base64 -w 0 /tmp/service_content)
  
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ inputs.module }} JAR - Run ID: ${{ github.run_id }}" \
            --parameters "commands=[
              \"echo '=== Starting JAR Deployment ==='\",
              \"echo 'Service: ${{ inputs.service_name }}'\",
              \"echo 'Module: ${{ inputs.module }}'\",
              \"echo 'Artifact: ${{ needs.build.outputs.artifact-name }}'\",
              \"echo '=== Stopping existing service ==='\",
              \"sudo systemctl stop ${{ inputs.service_name }} || true\",
              \"echo '=== Moveing application jar directory ==='\",
              \"cd /home/ec2-user/apps/jar/${{ inputs.module }}\",
              \"echo '=== Creating environment file ==='\",
              \"echo '$ENV_CONTENT' | base64 -d > .env\",
              \"echo '=== Downloading JAR from S3 ==='\",
              \"aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/deploy/${{ inputs.module }}/${{ needs.build.outputs.artifact-name }}.jar ${{ needs.build.outputs.artifact-name }}.jar\",
              \"ls -la ${{ steps.generate-artifact.outputs.artifact-name }}.jar\",
              \"echo '=== Creating systemd service ==='\",
              \"echo '$SERVICE_CONTENT' | base64 -d | sudo tee /etc/systemd/system/${{ inputs.service_name }}.service\",
              \"sudo systemctl daemon-reload\",
              \"sudo systemctl enable ${{ inputs.service_name }}\",
              \"echo '=== Starting service ==='\",
              \"sudo systemctl start ${{ inputs.service_name }}\",
              \"echo '=== Waiting for service to start ==='\",
              \"sleep 10\",
              \"echo '=== Service Status ==='\",
              \"sudo systemctl status ${{ inputs.service_name }} --no-pager || true\",
              \"echo '=== Service Logs ==='\",
              \"sudo journalctl -u ${{ inputs.service_name }} --no-pager -n 50 || true\",
              \"echo '=== Final Check ==='\",
              \"if sudo systemctl is-active --quiet ${{ inputs.service_name }}; then\",
              \"  echo 'Service is running successfully!'\",
              \"else\",
              \"  echo 'Service failed to start'\",
              \"  exit 1\",
              \"fi\",
              \"echo '=== Deployment Complete ==='\"
            ]" \
            --query 'Command.CommandId' \
            --output text)
  
          echo "SSM Command ID: $COMMAND_ID"
          echo "command-id=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait for deployment completion
        run: |
          echo "Waiting for SSM command to complete..."
          aws ssm wait command-executed \
            --command-id ${{ env.command-id }} \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --cli-read-timeout 600
  
          echo "SSM command completed!"

      - name: Get deployment results
        run: |
          echo "=== Fetching deployment results ==="
  
          COMMAND_STATUS=$(aws ssm get-command-invocation \
            --command-id ${{ env.command-id }} \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Status' \
            --output text)
  
          echo "Command Status: $COMMAND_STATUS"
  
          STDOUT=$(aws ssm get-command-invocation \
            --command-id ${{ env.command-id }} \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'StandardOutputContent' \
            --output text)
  
          echo "=== Deployment Output ==="
          echo "$STDOUT"
  
          STDERR=$(aws ssm get-command-invocation \
            --command-id ${{ env.command-id }} \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'StandardErrorContent' \
            --output text)
  
          if [ "$STDERR" != "None" ] && [ "$STDERR" != "" ]; then
            echo "=== Deployment Warnings/Errors ==="
            echo "$STDERR"
  
            if echo "$STDERR" | grep -qi "error\|failed\|fatal"; then
              echo "Error detected, failing deployment"
              exit 1
            else
              echo "Non-critical warnings detected, continuing"
            fi
          fi
  
          if [ "$COMMAND_STATUS" != "Success" ]; then
            echo "Deployment failed with status: $COMMAND_STATUS"
            exit 1
          fi
  
          echo "=== Deployment Success ==="