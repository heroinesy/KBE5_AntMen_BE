name: "Test: m-common simplified"

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:

jobs:
  test-build:
    name: 🔧 Test Build Only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate timestamp tag
        id: generate-tag
        run: |
          TIMESTAMP_TAG=$(date +%y%m%d_T%H)
          echo "timestamp-tag=$TIMESTAMP_TAG" >> $GITHUB_OUTPUT
          echo "Generated timestamp tag: $TIMESTAMP_TAG"

      - name: Test Gradle Build
        run: |
          echo "Testing Gradle build..."
          ./gradlew :m-common:bootJar -x test
          echo "✅ Gradle build successful"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Test AWS Connection
        run: |
          echo "Testing AWS connection..."
          aws sts get-caller-identity
          echo "✅ AWS connection successful"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Test ECR Access
        run: |
          echo "Testing ECR access..."
          aws ecr describe-repositories --repository-names m-common || echo "Repository doesn't exist, will create"
          echo "✅ ECR access successful"

      - name: Create ECR repo if missing
        run: |
          aws ecr describe-repositories --repository-names m-common || \
          aws ecr create-repository --repository-name m-common
          echo "✅ ECR repository ready"

      - name: Build Docker image (AMD64 only for faster testing)
        run: |
          echo "Building Docker image..."
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -t ${{ secrets.ECR_REGISTRY }}/m-common:test-${{ steps.generate-tag.outputs.timestamp-tag }} \
            -f m-common/Dockerfile \
            ./m-common
          echo "✅ Docker build and push successful"

  test-ssm:
    name: 🔧 Test SSM Connection
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Test SSM Connection
        run: |
          echo "Testing SSM connection..."
          aws ssm describe-instance-information \
            --instance-information-filter-list key=InstanceIds,valueSet=${{ secrets.EC2_INSTANCE_ID }}
          echo "✅ SSM connection successful"

      - name: Test Simple SSM Command
        run: |
          echo "Testing simple SSM command..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["echo \"Hello from SSM\"", "whoami", "pwd"]' \
            --query 'Command.CommandId' \
            --output text)
          
          echo "Command ID: $COMMAND_ID"
          
          # Wait for completion
          aws ssm wait command-executed \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }}
          
          # Get results
          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'StandardOutputContent' \
            --output text
          
          echo "✅ SSM command execution successful"