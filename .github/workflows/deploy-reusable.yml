name: Reusable Deploy JAR to EC2

permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      service_name:
        required: true
        type: string
      service_port:
        required: true
        type: string
    secrets:
      MYSQL_DATABASE:
        required: true
      MYSQL_HOST:
        required: true
      MYSQL_PASSWORD:
        required: true
      MYSQL_PORT:
        required: true
      MYSQL_USERNAME:
        required: true
      SPRING_DATABASE_URL:
        required: true
      AWS_REGION:
        required: true
      AWS_ROLE_TO_ASSUME:
        required: true
      EC2_INSTANCE_ID:
        required: true
      S3_BUCKET_NAME:
        required: true
      S3_REGION:
        required: true
      S3_ACCESS_KEY:
        required: true
      S3_SECRET_KEY:
        required: true
      JWT_SECRET:
        required: true
      GOOGLE_CLIENT_ID:
        required: true
      GOOGLE_CLIENT_SECRET:
        required: true
      GOOGLE_REDIRECT_URI:
        required: true
      REDIS_HOST:
        required: true
      REDIS_PORT:
        required: true
      REDIS_PASSWORD:
        required: true
  workflow_dispatch:

jobs:
  build:
    name: 🛠 Build & Upload JAR
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.generate-artifact.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate artifact name
        id: generate-artifact
        run: |
          ARTIFACT_NAME=$(date +%y%m%dT%H%M)
          echo "artifact-name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "Generated artifact name: $ARTIFACT_NAME"

      - name: Gradle Build
        run: ./gradlew :${{ inputs.module }}:bootJar -x test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create S3 bucket if missing
        run: |
          aws s3api head-bucket --bucket ${{ secrets.S3_BUCKET_NAME }} 2>/dev/null || \
          aws s3api create-bucket --bucket ${{ secrets.S3_BUCKET_NAME }} --region ${{ secrets.AWS_REGION }} \
            --create-bucket-configuration LocationConstraint=${{ secrets.AWS_REGION }}

      - name: Upload JAR to S3
        run: |
          JAR_FILE=$(find ${{ inputs.module }}/build/libs -name "*.jar" | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "No JAR file found!"
            exit 1
          fi
          
          echo "Uploading JAR: $JAR_FILE"
          aws s3 cp "$JAR_FILE" s3://${{ secrets.S3_BUCKET_NAME }}/deploy/${{ inputs.module }}/${{ steps.generate-artifact.outputs.artifact-name }}.jar
          
          echo "JAR uploaded successfully to S3"

  deploy:
    name: 🚀 Deploy JAR to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          # 환경 변수 파일 준비
          cat > /tmp/env_content << 'EOF'
          SPRING_PROFILES_ACTIVE=prod
          SERVER_PORT=${{ inputs.service_port }}
          
          # 데이터베이스 설정
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_HOST=${{ secrets.MYSQL_HOST }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_PORT=${{ secrets.MYSQL_PORT }}
          MYSQL_USERNAME=${{ secrets.MYSQL_USERNAME }}
          SPRING_DATABASE_URL=${{ secrets.SPRING_DATABASE_URL }}
          
          # AWS 설정
          S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
          S3_REGION=${{ secrets.S3_REGION }}
          S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          
          # 인증 설정
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}
          
          # REDIS 설정
          REDIS_HOST=${{ secrets.REDIS_HOST }}
          REDIS_PORT=${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          EOF
  
          ENV_CONTENT=$(base64 -w 0 /tmp/env_content)
  
          # systemd 서비스 파일 준비
          cat > /tmp/service_content << EOF
          [Unit]
          Description=${{ inputs.service_name }} Spring Boot Application
          After=network.target
  
          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/home/ec2-user/apps/jar/${{ inputs.module }}
          EnvironmentFile=/home/ec2-user/apps/jar/${{ inputs.module }}/.env
          
          # 로그 디렉토리 생성
          ExecStartPre=/bin/mkdir -p /home/ec2-user/apps/logs/${{ inputs.module }}
          ExecStartPre=/bin/chown -R ec2-user:ec2-user /home/ec2-user/apps/logs/${{ inputs.module }}
          
          # tee를 사용한 이중 로깅 (파일 + journal)
          ExecStart=/bin/bash -c '/usr/bin/java -jar /home/ec2-user/apps/jar/${{ inputs.module }}/${{ needs.build.outputs.artifact-name }}.jar 2>&1 | tee -a /home/ec2-user/apps/logs/${{ inputs.module }}/catalina.out'
          ExecStop=/bin/kill -15 \$MAINPID
          
          # systemd 로그 설정 (Spring Boot가 파일 로그 담당)
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=${{ inputs.service_name }}
          
          Restart=always
          RestartSec=10
  
          [Install]
          WantedBy=multi-user.target
          EOF
  
          SERVICE_CONTENT=$(base64 -w 0 /tmp/service_content)
          
          COMMAND_ID=$(aws ssm send-command \
          --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --comment "SIMPLE Deploy Test - Run ID: ${{ github.run_id }}" \
          --parameters "commands=[
            \"echo '=== SIMPLE DEPLOYMENT TEST ==='\",
            \"echo 'Current time: \$(date)'\",
            \"echo 'Current user: \$(whoami)'\",
            \"echo 'Service: ${{ inputs.service_name }}'\",
            \"echo 'Module: ${{ inputs.module }}'\",
            \"echo 'Artifact: ${{ needs.build.outputs.artifact-name }}'\",
            \"echo '=== Step 1: Service cleanup ==='\",
            \"sudo systemctl stop ${{ inputs.service_name }} || true\",
            \"sudo systemctl disable ${{ inputs.service_name }} || true\",
            \"sudo rm -f /etc/systemd/system/${{ inputs.service_name }}.service\",
            \"sudo systemctl daemon-reload\",
            \"sudo pkill -f '${{ inputs.module }}' || echo 'No processes to kill'\",
            \"sleep 3\",
            \"echo '=== Step 2: Directory setup ==='\",
            \"sudo mkdir -p /home/ec2-user/apps/jar/${{ inputs.module }}\",
            \"sudo mkdir -p /home/ec2-user/apps/logs/${{ inputs.module }}\",
            \"sudo chown -R ec2-user:ec2-user /home/ec2-user/apps/jar/${{ inputs.module }}\",
            \"sudo chown -R ec2-user:ec2-user /home/ec2-user/apps/logs/${{ inputs.module }}\",
            \"cd /home/ec2-user/apps/jar/${{ inputs.module }}\",
            \"echo '=== Step 3: Environment file ==='\",
            \"echo '$ENV_CONTENT' | base64 -d > .env\",
            \"echo 'Environment file result: \$?'\",
            \"wc -l .env\",
            \"echo '=== Step 4: S3 Download ==='\",
            \"aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/deploy/${{ inputs.module }}/${{ needs.build.outputs.artifact-name }}.jar ./${{ needs.build.outputs.artifact-name }}.jar\",
            \"echo 'S3 download result: \$?'\",
            \"ls -la ${{ needs.build.outputs.artifact-name }}.jar\",
            \"echo '=== Step 5: Service creation ==='\",
            \"echo '$SERVICE_CONTENT' | base64 -d > /tmp/service_file\",
            \"echo 'Service file decode result: \$?'\",
            \"wc -l /tmp/service_file\",
            \"sudo cp /tmp/service_file /etc/systemd/system/${{ inputs.service_name }}.service\",
            \"sudo systemctl daemon-reload\",
            \"sudo systemctl enable ${{ inputs.service_name }}\",
            \"echo '=== Step 6: Service start ==='\",
            \"sudo systemctl start ${{ inputs.service_name }}\",
            \"START_RESULT=\$?\",
            \"echo 'Service start result: '\$START_RESULT\",
            \"sleep 15\",
            \"echo '=== Step 7: Final check ==='\",
            \"sudo systemctl status ${{ inputs.service_name }} --no-pager\",
            \"if sudo systemctl is-active --quiet ${{ inputs.service_name }}; then\",
            \"  echo 'SUCCESS: Service is running!'\",
            \"  echo 'Port check:'\",
            \"  sudo netstat -tlnp | grep ${{ inputs.service_port }} || echo 'Port not yet bound'\",
            \"  echo 'Process check:'\",
            \"  ps aux | grep ${{ inputs.service_name }} | grep -v grep || echo 'Process not found'\",
            \"else\",
            \"  echo 'FAILED: Service is not running!'\",
            \"  sudo journalctl -u ${{ inputs.service_name }} --no-pager -n 30\",
            \"  exit 1\",
            \"fi\",
            \"echo '=== DEPLOYMENT COMPLETE ==='\"
          ]" \
          --query 'Command.CommandId' \
          --output text)
  
          echo "SSM Command ID: $COMMAND_ID"
          echo "command-id=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait for deployment completion
        run: |
          echo "Waiting for SSM command to complete..."
          aws ssm wait command-executed \
            --command-id ${{ env.command-id }} \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --cli-read-timeout 600
  
          echo "SSM command completed!"

      - name: Get deployment results
        run: |
          echo "=== Fetching deployment results ==="
          
          COMMAND_STATUS=$(aws ssm get-command-invocation \
            --command-id ${{ env.command-id }} \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Status' \
            --output text)
          
          echo "Command Status: $COMMAND_STATUS"
          
          STDOUT=$(aws ssm get-command-invocation \
            --command-id ${{ env.command-id }} \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'StandardOutputContent' \
            --output text)
          
          echo "=== Deployment Output ==="
          echo "$STDOUT"
          
          STDERR=$(aws ssm get-command-invocation \
            --command-id ${{ env.command-id }} \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'StandardErrorContent' \
            --output text)
          
          if [ "$STDERR" != "None" ] && [ "$STDERR" != "" ]; then
            echo "=== Deployment Warnings/Errors ==="
            echo "$STDERR"
          
              # 개선된 에러 판정 로직 - 예상되는 정상 메시지 제외
            if echo "$STDERR" | grep -q "Failed to stop.*not loaded"; then
              echo "Expected warning: Service was not running (normal for first deployment)"
            fi
            if echo "$STDERR" | grep -q "Failed to disable.*does not exist"; then
              echo "Expected warning: Service file didn't exist (normal for first deployment)"
            fi
            if echo "$STDERR" | grep -q "Created symlink"; then
              echo "Success: Service enabled successfully"
            fi
          
            # 실제 문제가 되는 에러만 확인
            if echo "$STDERR" | grep -qiE "(fatal|critical|cannot|permission denied|no such file|command not found)"; then
              echo "Critical error detected in deployment"
              exit 1
            else
              echo "No critical errors detected, deployment appears successful"
            fi
          fi
          
          if [ "$COMMAND_STATUS" != "Success" ]; then
            echo "Deployment failed with status: $COMMAND_STATUS"
            exit 1
          fi
          
          echo "=== Deployment Success ==="