name: Reusable Deploy to EC2

permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      dockerfile_path:
        required: true
        type: string
      compose_service:
        required: true
        type: string
    secrets:
      ENV_IMAGE_NAME:
        required: true
      MYSQL_DATABASE:
        required: true
      MYSQL_HOST:
        required: true
      MYSQL_PASSWORD:
        required: true
      MYSQL_PORT:
        required: true
      MYSQL_USERNAME:
        required: true
      SPRING_DATABASE_URL:
        required: true
      ECR_REGISTRY:
        required: true
      AWS_REGION:
        required: true
      AWS_ROLE_TO_ASSUME:
        required: true
      EC2_INSTANCE_ID:  # SSH 정보 대신 Instance ID 사용
        required: true
      S3_BUCKET_NAME:
        required: true
      S3_REGION:
        required: true
      S3_ACCESS_KEY:
        required: true
      S3_SECRET_KEY:
        required: true
      JWT_SECRET:
        required: true
      GOOGLE_CLIENT_ID:
        required: true
      GOOGLE_CLIENT_SECRET:
        required: true
      GOOGLE_REDIRECT_URI:
        required: true
  workflow_dispatch:

jobs:
  build:
    name: 🛠 Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      timestamp-tag: ${{ steps.generate-tag.outputs.timestamp-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate timestamp tag
        id: generate-tag
        run: |
          TIMESTAMP_TAG=$(date +%y%m%d_T%H)
          echo "timestamp-tag=$TIMESTAMP_TAG" >> $GITHUB_OUTPUT
          echo "Generated timestamp tag: $TIMESTAMP_TAG"

      - name: Gradle Build
        run: ./gradlew :${{ inputs.module }}:bootJar -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repo if missing
        run: |
          aws ecr describe-repositories --repository-names ${{ inputs.module }} || \
          aws ecr create-repository --repository-name ${{ inputs.module }}

      - name: Build and Push Docker image (Multi-Architecture)
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t ${{ secrets.ECR_REGISTRY }}/${{ inputs.module }}:latest \
            -t ${{ secrets.ECR_REGISTRY }}/${{ inputs.module }}:${{ steps.generate-tag.outputs.timestamp-tag }} \
            -f ${{ inputs.dockerfile_path }} \
            ./${{ inputs.module }}

  deploy:
    name: 🚀 Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Read docker-compose.yml content
        id: compose-content
        run: |
          # docker-compose.yml 파일 내용을 base64로 인코딩하여 안전하게 전달
          COMPOSE_CONTENT=$(base64 -w 0 docker-compose.yml)
          echo "compose-content=$COMPOSE_CONTENT" >> $GITHUB_OUTPUT

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ inputs.module }} - Run ID: ${{ github.run_id }}" \
            --parameters 'commands=[
              "echo \"=== Starting Deployment ===\"",
              "sudo rm -rf ~/apps/server",
              "mkdir -p ~/apps/server",
              "sudo chown -R $USER:$USER ~/apps/server",
              "cd ~/apps/server",
              "echo \"=== Creating docker-compose.yml ===\"",
              "echo \"${{ steps.compose-content.outputs.compose-content }}\" | base64 -d > docker-compose.yml",
              "echo \"=== Creating .env file ===\"",
              "cat <<\"ENV_EOF\" > .env
              SPRING_PROFILES_ACTIVE=prod
              IMAGE_NAME=${{ secrets.ENV_IMAGE_NAME }}
              MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
              MYSQL_HOST=${{ secrets.MYSQL_HOST }}
              MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
              MYSQL_PORT=${{ secrets.MYSQL_PORT }}
              MYSQL_USERNAME=${{ secrets.MYSQL_USERNAME }}
              SPRING_DATABASE_URL=${{ secrets.SPRING_DATABASE_URL }}
              ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}
              S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
              S3_REGION=${{ secrets.S3_REGION }}
              S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
              S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
              JWT_SECRET=${{ secrets.JWT_SECRET }}
              GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
              GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
              GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}
              ENV_EOF",
              "echo \"=== Checking disk space ===\"",
              "echo \"[Disk] Before cleanup\"",
              "df -h /",
              "echo \"=== Cleaning up Docker resources ===\"",
              "docker container prune -f",
              "docker image prune -f",
              "echo \"=== Setting up Docker network ===\"",
              "docker network ls | grep shared-net || docker network create shared-net",
              "echo \"=== Logging into ECR ===\"",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "echo \"=== Pulling Docker image ===\"",
              "docker pull ${{ secrets.ECR_REGISTRY }}/${{ inputs.module }}:latest",
              "echo \"=== Stopping existing container ===\"",
              "docker compose down ${{ inputs.compose_service }} || true",
              "echo \"=== Starting new container ===\"",
              "docker compose up -d ${{ inputs.compose_service }}",
              "echo \"=== Container Status ===\"",
              "docker ps -a || true",
              "echo \"=== Service Logs ===\"",
              "docker compose logs ${{ inputs.compose_service }} --tail=50 || true",
              "echo \"=== Deployment Complete ===\""
              ]' \
              --query 'Command.CommandId' \
              --output text)
            
              echo "SSM Command ID: $COMMAND_ID"
              echo "command-id=$COMMAND_ID" >> $GITHUB_ENV
            
      - name: Wait for deployment completion
        run: |
          echo "Waiting for SSM command to complete..."
          aws ssm wait command-executed \
            --command-id ${{ env.command-id }} \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --cli-read-timeout 600
          
          echo "SSM command completed!"

      - name: Get deployment results
        run: |
          echo "=== Fetching deployment results ==="
          
          # 명령 실행 결과 가져오기
          COMMAND_STATUS=$(aws ssm get-command-invocation \
            --command-id ${{ env.command-id }} \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Status' \
            --output text)
          
          echo "Command Status: $COMMAND_STATUS"
          
          # 표준 출력 가져오기
          STDOUT=$(aws ssm get-command-invocation \
            --command-id ${{ env.command-id }} \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'StandardOutputContent' \
            --output text)
          
          echo "=== Deployment Output ==="
          echo "$STDOUT"
          
          # 오류 출력 확인
          STDERR=$(aws ssm get-command-invocation \
            --command-id ${{ env.command-id }} \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'StandardErrorContent' \
            --output text)
          
          if [ "$STDERR" != "None" ] && [ "$STDERR" != "" ]; then
            echo "=== Deployment Errors ==="
            echo "$STDERR"
            exit 1
          fi
          
          # 명령이 실패했다면 워크플로우 실패
          if [ "$COMMAND_STATUS" != "Success" ]; then
            echo "Deployment failed with status: $COMMAND_STATUS"
            exit 1
          fi
          
          echo "=== Deployment Success ==="